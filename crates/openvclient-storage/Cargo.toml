[package]
name = "openvclient-storage"
description = "File and object storage connectors for OpenVClient: S3-compatible, FTP/FTPS and SSH (SFTP + remote commands)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
openvclient-core.workspace = true
openvclient-net.workspace = true
async-trait.workspace = true
serde_json.workspace = true
tokio.workspace = true
reqwest = { workspace = true, features = ["stream"] }
parking_lot.workspace = true
chrono.workspace = true
tracing.workspace = true
rusty-s3 = "0.11"
jiff = { version = "0.2", default-features = false, features = ["std"] }
url = "2"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.23"
futures-core = "0.3"
bytes = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
webpki-roots = "1"
suppaftp = { version = "12", features = ["tokio-rustls-ring", "deprecated"] }
russh = "=0.62.7"
russh-sftp = "3"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

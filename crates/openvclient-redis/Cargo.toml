[package]
name = "openvclient-redis"
description = "Redis connector for OpenVClient"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
openvclient-core.workspace = true
async-trait.workspace = true
tokio.workspace = true
redis = { version = "1.8", default-features = false, features = ["tokio-comp", "connection-manager", "tokio-native-tls-comp"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true

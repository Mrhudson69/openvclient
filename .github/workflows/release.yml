name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0 (leave empty for a dry run of the selected branch)"
        required: false
      dry_run:
        description: "Dry run: build, package and smoke-test only (no tag check, no release)"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  version:
    name: Check tag matches Cargo version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - id: v
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "Cargo version: $version, tag: $TAG, dry run: $DRY_RUN"
          if [ "$DRY_RUN" != "true" ] && [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match workspace version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  macos:
    name: macOS universal
    needs: version
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build both architectures
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          cargo build --release --locked -p openvclient-app --target aarch64-apple-darwin
          cargo build --release --locked -p openvclient-app --target x86_64-apple-darwin
      - name: Bundle universal .app
        run: |
          APP=dist/OpenVClient.app
          rm -rf dist && mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          lipo -create -output "$APP/Contents/MacOS/OpenVClient" \
            target/aarch64-apple-darwin/release/openvclient \
            target/x86_64-apple-darwin/release/openvclient
          lipo -archs "$APP/Contents/MacOS/OpenVClient"
          cp assets/icon/openvclient.icns "$APP/Contents/Resources/OpenVClient.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>OpenVClient</string>
            <key>CFBundleDisplayName</key><string>OpenVClient</string>
            <key>CFBundleIdentifier</key><string>dev.openvclient.client</string>
            <key>CFBundleVersion</key><string>${VERSION%%-*}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION%%-*}</string>
            <key>CFBundleExecutable</key><string>OpenVClient</string>
            <key>CFBundleIconFile</key><string>OpenVClient</string>
            <key>CFBundleInfoDictionaryVersion</key><string>6.0</string>
            <key>NSHumanReadableCopyright</key><string>© OpenVClient contributors · MIT OR Apache-2.0</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSApplicationCategoryType</key><string>public.app-category.developer-tools</string>
          </dict>
          </plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"
      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain-db
          KC_PASS=$(openssl rand -hex 16)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: Sign .app (Developer ID, hardened runtime)
        if: env.MACOS_CERTIFICATE != ''
        run: codesign --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" dist/OpenVClient.app
      - name: Ad-hoc sign .app (no certificate configured)
        if: env.MACOS_CERTIFICATE == ''
        run: codesign --force --deep --sign - dist/OpenVClient.app
      - name: Verify signature
        run: codesign --verify --deep --strict --verbose=2 dist/OpenVClient.app
      # dmgbuild runs in a venv; pin Python so a runner image update cannot break it.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build drag-to-Applications .dmg and .zip
        env:
          DMG_PYTHON: python3.12
        run: |
          # Background, Applications shortcut, icon layout and volume icon (dmgbuild).
          SKIP_BUILD=1 APP=dist/OpenVClient.app DMG_ARCH=universal ./scripts/package-macos-dmg.sh
          mkdir -p out
          mv "dist/OpenVClient-${VERSION}-macos-universal.dmg" out/
          ditto -c -k --keepParent dist/OpenVClient.app "out/OpenVClient-${VERSION}-macos-universal.zip"
      - name: Sign and notarise .dmg
        if: env.MACOS_CERTIFICATE != '' && env.APPLE_ID != ''
        run: |
          DMG="out/OpenVClient-${VERSION}-macos-universal.dmg"
          codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$DMG"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$DMG"
          # Re-zip the .app after stapling the bundle too.
          xcrun stapler staple dist/OpenVClient.app || true
          rm "out/OpenVClient-${VERSION}-macos-universal.zip"
          ditto -c -k --keepParent dist/OpenVClient.app "out/OpenVClient-${VERSION}-macos-universal.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: out/*
          if-no-files-found: error

  windows:
    name: Windows ${{ matrix.arch }}
    needs: version
    # Both architectures build on x64: the runner's Visual Studio has the ARM64
    # MSVC tools, and Inno Setup (32-bit) packages either.
    runs-on: windows-latest
    # ARM64 has never been built or run on real hardware (RELEASE_PLAN
    # milestone 0.3), so it must not block a release: it uploads artefacts
    # when it works and is ignored when it does not.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
          - arch: aarch64
            target: aarch64-pc-windows-msvc
            experimental: true
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # Builds, Authenticode-signs when WINDOWS_CERTIFICATE is set, and zips.
      # The installer script needs Inno Setup 6.6+ (dark mode, PNG wizard
      # images). Pinned and hash-checked; added to PATH for the next step.
      - name: Install Inno Setup
        shell: pwsh
        run: .\scripts\install-innosetup.ps1 -Dir "$env:RUNNER_TEMP\innosetup"
      - name: Build installer and portable zip
        shell: pwsh
        run: .\scripts\bundle-windows.ps1 -Target ${{ matrix.target }}
      - name: Show signature status
        shell: pwsh
        run: Get-AuthenticodeSignature target\${{ matrix.target }}\release\openvclient.exe | Format-List Status, SignerCertificate
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: |
            dist/*.zip
            dist/*.zip.sha256
            dist/*-setup.exe
            dist/*-setup.exe.sha256
          if-no-files-found: error

  # Install the setup.exe silently on a clean runner, launch it, then uninstall.
  # Hosted runners have no GPU, so the launch also exercises the Direct3D
  # (WARP) fallback for machines without OpenGL 2+.
  windows-smoke:
    name: Windows ${{ matrix.arch }} install smoke test
    needs: windows
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            inno: x64
            runner: windows-latest
          - arch: aarch64
            inno: arm64
            runner: windows-11-arm
            experimental: true
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-${{ matrix.arch }}
          path: dist
      - name: Install, launch, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem "dist\*-windows-${{ matrix.inno }}-setup.exe" | Select-Object -First 1
          $setupLog = Join-Path $env:RUNNER_TEMP "setup.log"
          $p = Start-Process $setup.FullName -Wait -PassThru -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/LOG=`"$setupLog`""
          if ($p.ExitCode -ne 0) { Get-Content $setupLog; throw "Setup failed with exit code $($p.ExitCode)" }

          $dir = Join-Path $env:LOCALAPPDATA "Programs\OpenVClient"
          $exe = Join-Path $dir "OpenVClient.exe"
          if (-not (Test-Path $exe)) { throw "Not installed: $exe" }
          $uninstallKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6B0F8C3E-4E57-4B7D-9A57-0E5C2D6F7A11}_is1"
          $entry = Get-ItemProperty $uninstallKey
          Write-Host "Apps entry: $($entry.DisplayName) $($entry.DisplayVersion), $($entry.Publisher), icon $($entry.DisplayIcon)"
          if ($entry.DisplayName -ne "OpenVClient" -or -not $entry.DisplayVersion) { throw "Unexpected Apps entry" }
          $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\OpenVClient\OpenVClient.lnk"
          if (-not (Test-Path $shortcut)) { throw "Start menu shortcut missing" }

          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 20
          $log = Join-Path $env:APPDATA "OpenVClient\OpenVClient\config\logs\openvclient.log"
          if (Test-Path $log) { Get-Content $log }
          if ($app.HasExited) { throw "OpenVClient exited during start-up (exit code $($app.ExitCode))" }
          if (-not $app.CloseMainWindow()) { Write-Warning "No main window to close; stopping the process"; Stop-Process -Id $app.Id -Force }
          if (-not $app.WaitForExit(20000)) { Stop-Process -Id $app.Id -Force; throw "OpenVClient did not close" }

          # Silent uninstall keeps user data (the default answer to the prompt).
          Start-Process (Join-Path $dir "unins000.exe") -Wait -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          # The uninstaller re-runs itself from %TEMP%, so wait for the files to go.
          for ($i = 0; $i -lt 60 -and (Test-Path $exe); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $exe) { throw "Uninstall left $exe behind" }
          if (Test-Path $uninstallKey) { throw "Uninstall left the Apps entry behind" }
          if (-not (Test-Path (Join-Path $env:APPDATA "OpenVClient"))) { throw "Silent uninstall removed user data" }
          Write-Host "Install, launch and uninstall OK"

  linux:
    name: Linux ${{ matrix.arch }}
    needs: version
    # Oldest supported runner = glibc baseline for the binary (2.35).
    runs-on: ${{ matrix.runner }}
    # See the Windows job: aarch64 is untested and never blocks a release.
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            experimental: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libxkbcommon-dev \
            libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libgl1-mesa-dev file \
            rpm python3-pil desktop-file-utils libfuse2
          # appimagetool from a pinned release (add a sha256 check once the release hash is recorded).
          APPIMAGETOOL_URL=https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-${{ matrix.arch }}.AppImage
          curl -fsSL -o /tmp/appimagetool "$APPIMAGETOOL_URL"
          chmod +x /tmp/appimagetool
          echo "APPIMAGETOOL=/tmp/appimagetool" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build and package (tar.gz, .deb, .rpm, AppImage)
        env:
          TARGET: ${{ matrix.target }}
        run: ./scripts/bundle-linux.sh
      - name: Check packages
        run: |
          dpkg-deb --info dist/*.deb && dpkg-deb --contents dist/*.deb | grep -E "applications|hicolor/256|bin/openvclient"
          rpm -qlp dist/*.rpm | grep -E "applications|bin/openvclient"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP" && desktop-file-validate "$RUNNER_TEMP"/openvclient-*/usr/share/applications/openvclient.desktop
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
          if-no-files-found: error

  # Install the .deb on a clean, newer Ubuntu, start the app under Xvfb
  # (Mesa llvmpipe), then remove the package.
  linux-smoke:
    name: Linux ${{ matrix.arch }} install smoke test
    needs: linux
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            debarch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            debarch: arm64
            runner: ubuntu-24.04-arm
            experimental: true
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: linux-${{ matrix.arch }}
          path: dist
      - name: Install, launch, remove
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri
          sudo apt-get install -y "./$(ls dist/openvclient_*_${{ matrix.debarch }}.deb)"
          command -v openvclient
          test -f /usr/share/applications/openvclient.desktop
          dpkg -s openvclient | grep -E '^(Version|Architecture):'
          # Still running after 20 s (timeout exits 124) means it started.
          set +e
          xvfb-run -a -s "-screen 0 1600x1000x24" timeout 20 openvclient
          code=$?
          set -e
          cat ~/.config/openvclient/logs/openvclient.log || true
          if [ "$code" -ne 124 ]; then echo "::error::openvclient exited with $code during start-up"; exit 1; fi
          sudo apt-get remove -y openvclient
          if command -v openvclient; then echo "::error::openvclient still installed"; exit 1; fi
          echo "Install, launch and removal OK"

  publish:
    name: Draft GitHub Release
    needs: [version, macos, windows, windows-smoke, linux, linux-smoke]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    env:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          path: src
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: |
          sha256sum * | tee SHA256SUMS
      - name: Sign checksums (GPG)
        if: env.GPG_PRIVATE_KEY != ''
        working-directory: artifacts
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=""
          case "$TAG" in v0.*|*-*) prerelease="--prerelease" ;; esac
          # Title: "Beta v0.1.0" for v0.1.0-beta.N, "RC v1.0.0" for -rc.N, else the tag.
          case "$TAG" in
            *-beta*)
              title="Beta ${TAG%%-*}"
              n=${TAG##*-beta.}
              # Later betas get their number: "Beta v1.0.0 (beta 2)".
              case "$n" in ''|1|*[!0-9]*) ;; *) title="$title (beta $n)" ;; esac
              ;;
            *-alpha*) title="Alpha ${TAG%%-*}" ;;
            *-rc*) title="RC ${TAG%%-*}" ;;
            *) title="OpenVClient $TAG" ;;
          esac
          # Notes: docs/release-notes/<tag>.md from the tagged commit, if present.
          notes_file="docs/release-notes/$TAG.md"
          git -C "$GITHUB_WORKSPACE/src" show "$TAG:$notes_file" > "$RUNNER_TEMP/notes.md" 2>/dev/null \
            || echo "Release $TAG. Verify downloads with: sha256sum -c SHA256SUMS" > "$RUNNER_TEMP/notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
          else
            gh release create "$TAG" artifacts/* --draft $prerelease --verify-tag \
              --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          fi
